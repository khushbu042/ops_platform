version: '3.3'

services:

  backend:
    build: .
    ports:
      - "5000:5000"

    depends_on:
      - postgres
      - redis
      - rabbitmq

    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq

  postgres:
    image: postgres:15

    environment:
      POSTGRES_DB: ops_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

  redis:
    image: redis:7

    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management

    ports:
      - "5672:5672"
      - "15672:15672"